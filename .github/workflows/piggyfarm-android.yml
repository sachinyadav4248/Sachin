name: Piggy Farm Android

on:
  push:
    branches: [main, piggyfarm-android]
    paths: ['piggyfarm-android/**', '.github/workflows/piggyfarm-android.yml']
  pull_request:
    paths: ['piggyfarm-android/**', '.github/workflows/piggyfarm-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piggyfarm-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: piggyfarm-android
        shell: bash
    env:
      # Optional release signing. Add these as repository secrets (see piggyfarm-android/README.md).
      KEYSTORE_B64: ${{ secrets.PIGGY_KEYSTORE_BASE64 }}
      PIGGY_KEYSTORE_PASSWORD: ${{ secrets.PIGGY_KEYSTORE_PASSWORD }}
      PIGGY_KEY_ALIAS: ${{ secrets.PIGGY_KEY_ALIAS }}
      PIGGY_KEY_PASSWORD: ${{ secrets.PIGGY_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships the Android SDK ($ANDROID_HOME); only the licenses need accepting so AGP can fetch platform 36.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee "$RUNNER_TEMP/build-debug.log"

      - name: Release bundle and APK (signed only if the keystore secrets exist)
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/piggyfarm-release.jks"
            export PIGGY_KEYSTORE_PATH="$RUNNER_TEMP/piggyfarm-release.jks"
            echo "Signing release with the repository keystore secrets."
          else
            echo "No keystore secrets: release outputs will be UNSIGNED (fine for checking R8, not uploadable to Play)."
          fi
          ./gradlew --stacktrace bundleRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/build-release.log"

      - name: Inspect the built APKs (package, SDK levels, signature)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|^launchable-activity|^uses-permission" || true
            "$APKSIGNER" verify --print-certs "$apk" 2>&1 | head -3 || true
          done
          ls -la app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piggyfarm-debug-apk
          path: piggyfarm-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piggyfarm-release
          path: |
            piggyfarm-android/app/build/outputs/bundle/release/*.aab
            piggyfarm-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            piggyfarm-android/app/build/reports
            piggyfarm-android/app/build/outputs/mapping
          if-no-files-found: ignore
